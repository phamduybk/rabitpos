; PHP config cho POS Ban Hang
; Extensions directory (relative to php.exe)
extension_dir = "ext"

; === Extensions can thiet ===
extension=pdo_sqlite
extension=sqlite3
extension=fileinfo
extension=gd
extension=mbstring
extension=curl
extension=openssl

; === Cau hinh chung ===
short_open_tag = On
date.timezone = Asia/Ho_Chi_Minh
upload_max_filesize = 200M
post_max_size = 200M
memory_limit = 256M
max_execution_time = 60
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
display_errors = Off
log_errors = On
